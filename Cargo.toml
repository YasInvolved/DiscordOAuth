[package]
name = "discordoauthapi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
urlencoding = "2.1.3"
dotenvy = "0.15.7"
migration = { path = "./migration" }
rand = "0.10.2"
base64 = "0.23.1"
aes-gcm = "0.11.0"
hex = "0.4.3"
chrono = "0.4.45"
uuid = { version = "1.26.0", features = ["v4"] }
